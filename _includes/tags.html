{%- comment -%}
  Renders the tag pills for an essay. Usage: {% include tags.html tags=essay.tags %}
{%- endcomment -%}
{%- if include.tags and include.tags.size > 0 -%}
<span class="essay-tags">
  {%- for tag in include.tags -%}
  <span class="tag tag--{{ tag | slugify }}">{{ tag }}</span>
  {%- endfor -%}
</span>
{%- endif -%}
